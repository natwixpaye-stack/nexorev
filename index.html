<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexoRév — Ta réussite, notre priorité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  // Fallback check: if DATA not loaded after 1s, try reload
  setTimeout(()=>{
    if(!window.NEXO_DATA || !window.NEXO_DATA.SPECIALITES || window.NEXO_DATA.SPECIALITES.length===0){
      console.warn('DATA still missing after 1s, retrying...');
      // Try to fetch data.js again
      fetch('data.js').then(r=>r.text()).then(t=>{
        console.log('data.js fetched, length', t.length);
      });
    }
  }, 1000);
</script>
</body>
</html>
